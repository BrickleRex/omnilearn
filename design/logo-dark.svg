<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160" role="img" aria-label="Omnilearn">
  <title>Omnilearn</title>
  <!-- Playroom mark: a chunky offset tile, the hollow O you have to type through, and a ghost caret -->
  <rect x="26" y="30" width="112" height="112" rx="26" fill="#1B1B1F"/>
  <rect x="16" y="20" width="112" height="112" rx="26" fill="#FF5C39" stroke="#1B1B1F" stroke-width="6"/>
  <circle cx="72" cy="76" r="30" fill="none" stroke="#1B1B1F" stroke-width="10"/>
  <circle cx="72" cy="76" r="30" fill="none" stroke="#FFC700" stroke-width="10" stroke-dasharray="94 200" transform="rotate(-90 72 76)"/>
  <rect x="104" y="60" width="8" height="34" rx="2" fill="#2B50FF"/>
  <text x="170" y="103" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Omnilearn</text>
  <text x="172" y="134" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#8FA3FF" letter-spacing="2">TYPE EVERY LINE. LEARN ANYTHING.</text>
</svg>
